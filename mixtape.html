<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>buchiii's music playlist</title>
<link rel="icon" href="assets/gate/mochiiihead.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,600&family=Sora:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#2A2033; --bg2:#120E17;
    --cream:#F7F1E8;
    --grape:#B79CE0;
    --grape-deep:#8B6FB3;
    --gold:#E8C468;
    --ink:#F7F1E8;
    --ink-soft:rgba(247,241,232,.6);
    --line:rgba(247,241,232,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 0%, rgba(183,156,224,.18), transparent 55%),
      radial-gradient(circle at 90% 100%, rgba(232,196,104,.10), transparent 50%),
      linear-gradient(180deg,var(--bg1),var(--bg2));
    color:var(--ink);
    font-family:'Sora',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;justify-content:center;
    position:relative;
  }
  .app{max-width:440px;width:100%;padding:34px 20px 50px;position:relative;z-index:1;}

  .eyebrow{font-size:11px;letter-spacing:2px;color:var(--ink-soft);text-transform:uppercase;text-align:center;}
  h1{
    font-family:'Fraunces',serif;font-style:italic;font-weight:600;
    font-size:24px;margin:6px 0 0;text-align:center;
  }

  /* ---------- Screen: choose artist ---------- */
  .screen{display:none;}
  .screen.active{display:block;}

  .artist-list{margin-top:30px;display:flex;flex-direction:column;gap:14px;}
  .artist-card{
    display:flex;align-items:center;gap:16px;
    background:rgba(255,255,255,.04);border:1px solid var(--line);
    border-radius:16px;padding:12px;cursor:pointer;
    transition:background .2s ease, transform .15s ease;
  }
  .artist-card:hover{background:rgba(255,255,255,.07);}
  .artist-card:active{transform:scale(.98);}
  .artist-card img{
    width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0;
    box-shadow:0 8px 18px rgba(0,0,0,.35);
  }
  .artist-card .meta{flex:1;}
  .artist-card .name{font-family:'Fraunces',serif;font-weight:600;font-style:italic;font-size:17px;}
  .artist-card .count{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .artist-card .arrow{color:var(--ink-soft);flex-shrink:0;}

  /* ---------- Screen: songs / player ---------- */
  .back-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;}
  .back-btn{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;
    display:flex;align-items:center;gap:6px;font-family:'Sora',sans-serif;font-size:12.5px;
    padding:4px 6px 4px 2px;border-radius:20px;
    transition:color .2s ease, background .2s ease, transform .15s ease;
  }
  .back-btn svg{transition:transform .25s cubic-bezier(.4,0,.2,1);}
  .back-btn:hover{color:var(--ink);background:rgba(255,255,255,.05);}
  .back-btn:hover svg{transform:translateX(-3px);}
  .back-btn:active{transform:scale(.94);}

  /* ---------- visitor badge: name + avatar from the confidential page ---------- */
  .visitor-badge{
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.04);border:1px solid var(--line);
    border-radius:20px;padding:4px 12px 4px 4px;
    font-family:'Sora',sans-serif;font-size:12.5px;color:var(--ink-soft);
  }
  .visitor-badge img{
    width:26px;height:26px;border-radius:50%;object-fit:cover;
    box-shadow:0 0 0 1px rgba(247,241,232,.18);
  }
  .visitor-badge .visitor-name{
    font-family:'Fraunces',serif;font-style:italic;font-weight:600;color:var(--gold);
  }

  /* ---------- Screen transition animation ---------- */
  @keyframes slideOutRight{to{transform:translateX(28px);opacity:0;}}
  @keyframes slideOutLeft{to{transform:translateX(-28px);opacity:0;}}
  @keyframes slideInLeft{from{transform:translateX(-28px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  @keyframes slideInRight{from{transform:translateX(28px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  .anim-out-right{animation:slideOutRight .26s cubic-bezier(.4,0,.2,1) forwards;}
  .anim-out-left{animation:slideOutLeft .26s cubic-bezier(.4,0,.2,1) forwards;}
  .anim-in-left{animation:slideInLeft .32s cubic-bezier(.4,0,.2,1) both;}
  .anim-in-right{animation:slideInRight .32s cubic-bezier(.4,0,.2,1) both;}

  /* ---------- Mini vinyls arranged in an arc around the turntable ---------- */
  .rig{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:8px;}
  .turntable-stage{position:relative;width:100%;max-width:280px;margin:74px auto 0;}

  .songs-arc{position:absolute;inset:0;z-index:4;pointer-events:none;}
  .song-disc{
    position:absolute;width:56px;text-align:center;cursor:pointer;
    pointer-events:auto;transform:translate(-50%,-50%);
    transition:transform .2s ease;
  }
  .song-disc:hover{transform:translate(-50%,-50%) scale(1.08);}
  .song-disc .ring{
    width:56px;height:56px;border-radius:50%;
    background:#0d0910;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px rgba(0,0,0,.35);
    border:2px solid transparent;position:relative;
  }
  .song-disc.active .ring{
    border-color:var(--grape);
    box-shadow:0 6px 14px rgba(0,0,0,.35), 0 0 12px 2px rgba(183,156,224,.5);
  }
  .song-disc img{width:60%;height:60%;border-radius:50%;object-fit:cover;}

  .neon-ring{
    position:absolute;inset:-16px;border-radius:50%;pointer-events:none;z-index:0;
    background:radial-gradient(circle, rgba(183,156,224,.55), rgba(183,156,224,.16) 60%, transparent 75%);
    filter:blur(6px);
    transform:scale(1);
    transition:transform .1s linear, opacity .1s linear;
  }
  .turntable{
    width:100%;max-width:280px;aspect-ratio:1/1;border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #241a2c, #0d0910 72%);
    box-shadow:0 18px 36px rgba(0,0,0,.4), inset 0 0 0 10px rgba(255,255,255,.03);
    display:flex;align-items:center;justify-content:center;position:relative;z-index:1;
  }
  .disc{
    width:88%;height:88%;border-radius:50%;position:relative;overflow:hidden;
    background:
      repeating-radial-gradient(circle, rgba(255,255,255,.045) 0 3px, transparent 3px 7px),
      #0d0910;
    display:flex;align-items:center;justify-content:center;
  }
  .disc.spinning{animation:spin 4s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .disc img{
    width:58%;height:58%;border-radius:50%;object-fit:cover;
    box-shadow:0 0 0 2px rgba(0,0,0,.4), 0 0 0 3px rgba(255,255,255,.08);
    transition:visibility 0s;
  }
  .cover-placeholder{
    position:absolute;width:58%;height:58%;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--ink-soft);border:1px dashed rgba(247,241,232,.25);
    background:rgba(255,255,255,.03);
  }

  .trackinfo{text-align:center;margin-top:26px;position:relative;z-index:2;}
  .trackinfo .name{font-family:'Fraunces',serif;font-weight:600;font-size:17px;}
  .trackinfo .from{font-size:12px;color:var(--ink-soft);margin-top:3px;}

  .transport{margin-top:14px;}
  .progress-row{display:flex;align-items:center;gap:8px;}
  .time{font-family:'Space Mono',monospace;font-size:10px;color:var(--ink-soft);width:30px;}
  .time.end{text-align:right;}
  .progress-track{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden;cursor:pointer;}
  .progress-fill{height:100%;width:0%;background:var(--grape);border-radius:3px;}
  .controls{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:12px;}
  .controls button{background:none;border:none;cursor:pointer;color:var(--ink);opacity:.85;padding:4px;}
  .controls button:hover{opacity:1;}
  .play-btn{
    width:44px;height:44px;border-radius:50%;
    background:var(--cream);color:#241329;
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- Themed magical backgrounds (behind the app) ---------- */
  .theme-bg{
    position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
    opacity:0;transition:opacity 1.1s ease;
  }
  .theme-bg.show{opacity:1;}
  .galaxy-layer,.milkyway-layer,.starsmoon-layer,.sunflowersil-layer,.graffiti-layer{position:absolute;inset:0;display:none;}
  .theme-bg[data-theme="galaxy"] .galaxy-layer{display:block;}
  .theme-bg[data-theme="milkyway"] .milkyway-layer{display:block;}
  .theme-bg[data-theme="stars_moon"] .starsmoon-layer{display:block;}
  .theme-bg[data-theme="sunflower_silhouette"] .sunflowersil-layer{display:block;}
  .theme-bg[data-theme="graffiti"] .graffiti-layer{display:block;}

  .star{position:absolute;border-radius:50%;background:#F7F1E8;animation:twinkle ease-in-out infinite;}
  .star.dim{background:#CFC6DC;}
  .star.bright{box-shadow:0 0 6px 1px rgba(247,241,232,.85);}
  @keyframes twinkle{0%,100%{opacity:.1;transform:scale(1);}50%{opacity:1;transform:scale(1.9);}}
  .nebula{position:absolute;border-radius:50%;filter:blur(46px);opacity:.28;animation:drift ease-in-out infinite;}
  @keyframes drift{0%,100%{transform:translate(0,0);}50%{transform:translate(24px,-18px);}}
  .shooting-star{
    position:absolute;width:110px;height:2px;border-radius:2px;opacity:0;
    background:linear-gradient(90deg, rgba(247,241,232,0), rgba(247,241,232,.95));
    animation:shoot linear infinite;
  }
  @keyframes shoot{
    0%{opacity:0;transform:translateX(0) rotate(var(--ang,22deg));}
    2%{opacity:1;}
    12%{opacity:0;transform:translateX(360px) rotate(var(--ang,22deg));}
    100%{opacity:0;transform:translateX(360px) rotate(var(--ang,22deg));}
  }

  /* ---- galaxy: real nebula photo as the base ---- */
  .galaxy-layer{
    background-image:url('assets/backgrounds/galaxy.jpg');
    background-size:cover;
    background-position:center;
  }

  /* ---- milkyway: real Milky Way photo as the base ---- */
  .milkyway-layer{
    background-image:url('assets/backgrounds/milkyway.jpg');
    background-size:cover;
    background-position:center;
  }

  /* ---- stars & moon: real moon-through-the-trees photo as the base ---- */
  .starsmoon-layer{
    background-image:url('assets/backgrounds/starsmoon.jpg');
    background-size:cover;
    background-position:center;
  }
  .moon-crater{position:absolute;border-radius:50%;background:rgba(170,150,100,.28);}
  .cloud{position:absolute;background:rgba(247,241,232,.09);border-radius:50px;filter:blur(2px);animation:cloudDrift linear infinite alternate;}
  @keyframes cloudDrift{from{transform:translateX(-6%);}to{transform:translateX(6%);}}

  /* ---- fireflies / drifting sparks: reusable glowing dot that wanders and
     pulses — used for real fireflies (stars_moon) and for the colour
     sparks layered over the graffiti photo ---- */
  .firefly{
    position:absolute;border-radius:50%;
    animation:fireflyDrift ease-in-out infinite, fireflyGlow ease-in-out infinite;
  }
  @keyframes fireflyDrift{
    0%,100%{transform:translate(0,0);}
    25%{transform:translate(12px,-16px);}
    50%{transform:translate(-10px,-6px);}
    75%{transform:translate(8px,12px);}
  }
  @keyframes fireflyGlow{0%,100%{opacity:.2;}50%{opacity:.95;}}

  /* ---- sunflower silhouette under a starry night sky ----
     the real photo (warm sunset) is tinted dark/purple to read as night,
     then twinkling stars are scattered on top via JS. */
  .sunflowersil-layer{
    background-image:
      linear-gradient(180deg, rgba(20,14,30,.78) 0%, rgba(18,13,26,.58) 40%, rgba(16,11,22,.30) 68%, rgba(14,10,20,.55) 100%),
      url('assets/backgrounds/sunflower.png');
    background-size:cover;
    background-position:center 70%;
  }

  /* ---- graffiti: real ink-swirl photo, with drifting colour sparks
     layered on top for movement and a light vignette for readability ---- */
  .graffiti-layer{
    background-image:url('assets/backgrounds/graf.jpg');
    background-size:cover;
    background-position:center;
  }
  .graffiti-layer::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(10,8,14,.30) 0%, rgba(10,8,14,.10) 35%, rgba(10,8,14,.18) 65%, rgba(10,8,14,.48) 100%);
  }

  /* ---------- Flying vinyl swap clones ---------- */
  .vinyl-fly{
    position:fixed;z-index:50;object-fit:cover;pointer-events:none;
    box-shadow:0 10px 26px rgba(0,0,0,.45);
    transition:left .48s cubic-bezier(.4,0,.2,1), top .48s cubic-bezier(.4,0,.2,1),
               width .48s cubic-bezier(.4,0,.2,1), height .48s cubic-bezier(.4,0,.2,1),
               opacity .48s ease;
  }

  /* ---------- Footer note ---------- */
  .site-footer{
    position:fixed;left:0;right:0;
    bottom:max(14px, env(safe-area-inset-bottom));
    z-index:2;
    text-align:center;pointer-events:none;
    font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.6px;
    color:var(--ink-soft);
  }
</style>
</head>

  <div class="graffiti-layer" id="graffitiLayer"></div>

          </button>
        </div>
      </div>
    </div>

  </div>

</div>

<div class="site-footer"> Press play &amp; vibe</div>

<audio id="audio" preload="metadata"></audio>

/* rotation-safe rect: the big disc keeps spinning, and getBoundingClientRect()
   on a rotating element returns an inflated diagonal bounding box. offsetWidth/
   offsetHeight ignore transforms, and the rotation is a pure spin around the
   element's own center, so we can combine the two safely. */
function centeredRect(el){
  const rect = el.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  return { left: cx - w/2, top: cy - h/2, width: w, height: h };
}

/* ---------- beat-reactive neon ring ---------- */
const neonRing = document.getElementById('neonRing');
let audioCtx, analyser, audioSource, dataArray;
let neonRaf = null;

function ensureAudioGraph(){
  if(audioCtx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  audioCtx = new Ctx();
  audioSource = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 64;
  audioSource.connect(analyser);
  analyser.connect(audioCtx.destination);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
}

function animateNeon(){
  if(!playing) return;
  analyser.getByteFrequencyData(dataArray);
  let sum = 0;
  for(let i=0;i<dataArray.length;i++) sum += dataArray[i];
  const level = sum / dataArray.length / 255; // 0..1
  const hue = 285 - level * 90; // grape -> hot pink/cyan as it gets louder
  neonRing.style.transform = `scale(${1 + level*0.22})`;
  neonRing.style.background = `radial-gradient(circle, hsla(${hue},85%,72%,${0.5 + level*0.4}), hsla(${hue},85%,68%,${0.18 + level*0.28}) 60%, transparent 75%)`;
  neonRaf = requestAnimationFrame(animateNeon);
}

function resetNeon(){
  if(neonRaf) cancelAnimationFrame(neonRaf);
  neonRaf = null;
  neonRing.style.transform = 'scale(1)';
  neonRing.style.background = 'radial-gradient(circle, rgba(183,156,224,.55), rgba(183,156,224,.16) 60%, transparent 75%)';
}

function fmt(s){
  if(!isFinite(s)) return '0:00';
  return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
}

    const dur = 2 + Math.random()*3, delay = Math.random()*4;

    html += `<div class="${cls}" style="top:${top}%;left:${left}%;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
  }

  for(let i=0;i<3;i++){
    const top = 5 + Math.random()*55, left = Math.random()*65;

/* ---------- navigation (with slide animation) ---------- */
let navigating = false;

function goTo(fromEl, toEl, direction){
  if(navigating) return;
  navigating = true;

  const outClass = direction === 'forward' ? 'anim-out-left' : 'anim-out-right';
  const inClass  = direction === 'forward' ? 'anim-in-right' : 'anim-in-left';

  fromEl.classList.add(outClass);

  fromEl.addEventListener('animationend', function onOut(){
    fromEl.removeEventListener('animationend', onOut);
    fromEl.classList.remove('active', outClass);

    toEl.classList.add('active', inClass);
    toEl.addEventListener('animationend', function onIn(){
      toEl.removeEventListener('animationend', onIn);
      toEl.classList.remove(inClass);
      navigating = false;
      positionSongsArc();
    });
  });
}

function openArtist(id){
  currentArtist = ARTISTS.find(a=>a.id===id);
  currentSongIndex = -1;
  artistTitle.textContent = currentArtist.name;
  artistEyebrow.textContent = 'now playing';
  renderSongsRow();
  showBlankPlayer();
  goTo(screenArtists, screenSongs, 'forward');
}

backBtn.addEventListener('click', ()=>{
  if(navigating) return;
  audio.pause();
  setPaused();
  setTheme(null);
  goTo(screenSongs, screenArtists, 'backward');
});

/* ---------- render: mini vinyls arranged in an arc around the turntable ---------- */
function renderSongsRow(){
  songsRow.innerHTML = '';
  currentArtist.songs.forEach((s,i)=>{
    const el = document.createElement('div');
    el.className = 'song-disc' + (i===currentSongIndex ? ' active' : '');
    el.title = s.title;
    el.innerHTML = `<div class="ring"><img src="${s.cover}" alt="${s.title}"></div>`;
    el.addEventListener('click', ()=> flyAnimateSwitch(i, true));
    songsRow.appendChild(el);
  });
  positionSongsArc();
}

function positionSongsArc(){
  const stage = document.querySelector('.turntable-stage');
  if(!stage || !songsRow) return;
  const discs = songsRow.querySelectorAll('.song-disc');
  if(!discs.length) return;

  const size = stage.offsetWidth;
  if(!size) return;

  const center = size / 2;
  const n = discs.length;

  // mini vinyls are bigger now — shrink a bit only once there are lots of songs
  const baseDiscSize = 56;
  const minDiscSize = 38;
  const discSize = n <= 8 ? baseDiscSize : Math.max(minDiscSize, baseDiscSize - (n - 8) * 1.8);

  const gap = 20; // space between turntable edge and nearest disc
  const radius = center + gap + discSize / 2;

  // guarantee this much empty space between adjacent disc edges
  const edgeGap = 10;
  const minStepDeg = ((discSize + edgeGap) / radius) * (180 / Math.PI);
  // spread now reaches past a half circle (180deg) around the turntable,
  // wrapping the mini vinyls further round instead of stopping at the top
  const spread = Math.min(320, minStepDeg * (n - 1 || 1));
  const start = -spread / 2;
  const step = n > 1 ? spread / (n - 1) : 0;

  discs.forEach((d, i) => {
    const deg = start + step * i;
    const rad = deg * Math.PI / 180;
    const x = center + radius * Math.sin(rad);
    const y = center - radius * Math.cos(rad);
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    d.style.width = discSize + 'px';
    d.style.height = discSize + 'px';
    const ring = d.querySelector('.ring');
    if(ring){ ring.style.width = discSize + 'px'; ring.style.height = discSize + 'px'; }
  });
}

window.addEventListener('resize', ()=>{
  if(currentArtist) positionSongsArc();
});

/* ---------- blank player state (shown right after picking an artist) ---------- */
function showBlankPlayer(){
  audio.pause();
  audio.removeAttribute('src');
  coverImg.removeAttribute('src');
  coverImg.style.display = 'none';
  coverPlaceholder.style.display = 'flex';
  trackName.textContent = 'Select a song';
  trackFrom.textContent = '';
  fill.style.width = '0%';
  tcur.textContent = '0:00';
  tend.textContent = '0:00';
  setTheme(null);
  setPaused();
}

function loadSong(i, autoplay){
  currentSongIndex = i;
  const s = currentArtist.songs[i];
  coverPlaceholder.style.display = 'none';
  coverImg.style.display = '';
  coverImg.src = s.cover;
  trackName.textContent = s.title;
  trackFrom.textContent = s.from || 'chorus';
  audio.src = s.audio;
  renderSongsRow();
  setTheme(s.theme || null);
  fill.style.width = '0%';
  tcur.textContent = '0:00';
  if(autoplay){
    audio.addEventListener('loadedmetadata', ()=>{ tend.textContent = fmt(audio.duration); }, {once:true});
    play();
  } else {
    setPaused();
  }
}

/* ---------- flying vinyl swap: mini disc <-> big turntable ---------- */
function flyAnimateSwitch(newIndex, autoplay){
  if(currentSongIndex === -1 || newIndex === currentSongIndex || vinylFlying || !currentArtist){
    loadSong(newIndex, autoplay);
    return;
  }

  const oldIndex = currentSongIndex;
  const discEls = songsRow.querySelectorAll('.song-disc');
  const targetMini = discEls[newIndex];
  const oldMini = discEls[oldIndex];
  if(!targetMini || !oldMini){
    loadSong(newIndex, autoplay);
    return;
  }

  vinylFlying = true;

  const targetImgEl = targetMini.querySelector('img');
  const oldImgEl = oldMini.querySelector('img');
  const targetRect = centeredRect(targetImgEl);
  const oldMiniRect = centeredRect(oldImgEl);
  const bigRect = centeredRect(coverImg);

  const newSrc = currentArtist.songs[newIndex].cover;
  const oldSrc = coverImg.src;

  targetImgEl.style.visibility = 'hidden';
  oldImgEl.style.visibility = 'hidden';
  coverImg.style.visibility = 'hidden';

  const flyIn = document.createElement('img');
  flyIn.src = newSrc;
  flyIn.className = 'vinyl-fly';
  flyIn.style.borderRadius = '50%';
  flyIn.style.left = targetRect.left + 'px';
  flyIn.style.top = targetRect.top + 'px';
  flyIn.style.width = targetRect.width + 'px';
  flyIn.style.height = targetRect.height + 'px';
  flyIn.style.opacity = '1';
  document.body.appendChild(flyIn);

  const flyOut = document.createElement('img');
  flyOut.src = oldSrc;
  flyOut.className = 'vinyl-fly';
  flyOut.style.borderRadius = '50%';
  flyOut.style.left = bigRect.left + 'px';
  flyOut.style.top = bigRect.top + 'px';
  flyOut.style.width = bigRect.width + 'px';
  flyOut.style.height = bigRect.height + 'px';
  flyOut.style.opacity = '1';
  document.body.appendChild(flyOut);

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      flyIn.style.left = bigRect.left + 'px';
      flyIn.style.top = bigRect.top + 'px';
      flyIn.style.width = bigRect.width + 'px';
      flyIn.style.height = bigRect.height + 'px';

      flyOut.style.left = oldMiniRect.left + 'px';
      flyOut.style.top = oldMiniRect.top + 'px';
      flyOut.style.width = oldMiniRect.width + 'px';
      flyOut.style.height = oldMiniRect.height + 'px';
      flyOut.style.opacity = '0.35';
    });
  });

  setTimeout(()=>{
    flyIn.remove();
    flyOut.remove();
    targetImgEl.style.visibility = '';
    oldImgEl.style.visibility = '';
    coverImg.style.visibility = '';
    loadSong(newIndex, autoplay);
    vinylFlying = false;
  }, 500);
}

function play(){
  if(currentSongIndex === -1) return;
  ensureAudioGraph();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  audio.play().then(()=>{
    playing = true;
    disc.classList.add('spinning');
    playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>';
    animateNeon();
  }).catch(()=>{ /* blocked, tap play manually */ });
}

function setPaused(){
  playing = false;
  disc.classList.remove('spinning');
  playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  resetNeon();
}

playBtn.addEventListener('click', ()=>{
  if(currentSongIndex === -1) return;
  if(playing){ audio.pause(); setPaused(); }
  else { play(); }
});

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(currentSongIndex === -1 || !currentArtist) return;
  flyAnimateSwitch((currentSongIndex - 1 + currentArtist.songs.length) % currentArtist.songs.length, true);
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(currentSongIndex === -1 || !currentArtist) return;
  flyAnimateSwitch((currentSongIndex + 1) % currentArtist.songs.length, true);
});

audio.addEventListener('loadedmetadata', ()=>{
  tend.textContent = fmt(audio.duration);
});

audio.addEventListener('timeupdate', ()=>{
  const pct = (audio.currentTime / audio.duration) * 100 || 0;
  fill.style.width = pct + '%';
  tcur.textContent = fmt(audio.currentTime);
});

audio.addEventListener('ended', ()=>{
  setPaused();
  document.getElementById('nextBtn').click();
});

progressTrack.addEventListener('click', (e)=>{
  if(currentSongIndex === -1) return;
  const rect = progressTrack.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

renderArtists();
</script>
